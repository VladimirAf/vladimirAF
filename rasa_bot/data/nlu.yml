version: "3.1"
nlu:
- intent: greet
  examples: |
    - привет
    - здравствуйте
    - добрый день

- intent: ask_docs
  examples: |
    - найди в документации [процедуру](topic)
    - как настроить доступ к системе
    - где инструкция по установке
    - что написано про SLA

- intent: ask_ticket
  examples: |
    - создай тикет
    - открыть заявку
    - нужна заявка на доступ
    - хочу оформить тикет на баг

- intent: out_of_scope
  examples: |
    - расскажи шутку
    - какая погода